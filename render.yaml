services:
  - type: web
    name: fuyuko-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
